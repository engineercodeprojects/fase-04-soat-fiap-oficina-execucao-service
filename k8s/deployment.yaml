apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execucao-service
  labels:
    {
      app.kubernetes.io/name: oficina-execucao-service,
      app.kubernetes.io/part-of: oficina-mecanica,
      app.kubernetes.io/component: api,
    }
spec:
  replicas: 2
  selector:
    matchLabels:
      { app.kubernetes.io/name: oficina-execucao-service, app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {
          app.kubernetes.io/name: oficina-execucao-service,
          app.kubernetes.io/part-of: oficina-mecanica,
          app.kubernetes.io/component: api,
        }
      annotations:
        { prometheus.io/scrape: 'true', prometheus.io/port: '3002', prometheus.io/path: '/metrics' }
    spec:
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              { app.kubernetes.io/name: oficina-execucao-service, app.kubernetes.io/component: api }
      containers:
        - name: app
          image: oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: oficina-execucao-service-config }
            - secretRef: { name: oficina-execucao-service-app }
          env:
            - { name: DD_AGENT_HOST, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
          startupProbe:
            { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe:
            {
              httpGet: { path: /health, port: http },
              periodSeconds: 15,
              timeoutSeconds: 5,
              failureThreshold: 3,
            }
          readinessProbe:
            {
              httpGet: { path: /health/ready, port: http },
              periodSeconds: 10,
              timeoutSeconds: 5,
              failureThreshold: 3,
            }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
